name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Dependencies are locked in deno.lock, so install them with Deno.
      # Cypress's binary download is skipped: only Playwright runs here.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno install --frozen

      # The scripts and the Playwright dev server run on Node, where the app
      # falls back to its in-memory KV, the same as `npm run dev` locally.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Playwright starts `npm run dev` itself (see playwright.config.ts).
      - name: Playwright tests
        run: npm run test:e2e

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
